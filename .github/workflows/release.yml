name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the plugin version
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match .claude-plugin/plugin.json version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build the archive
        run: git archive --format=zip --prefix=rumo/ -o "rumo-${VERSION}.zip" HEAD

      - name: Extract this version's release notes
        run: |
          awk -v h="## [${VERSION}]" 'index($0, h) == 1 { found = 1; next } /^## \[/ { found = 0 } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no CHANGELOG.md section for ${VERSION}" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" "rumo-${VERSION}.zip" --title "rumo ${VERSION}" --notes-file notes.md
