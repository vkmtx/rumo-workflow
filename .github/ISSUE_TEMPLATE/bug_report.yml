name: Bug report
description: Something in rumo behaves wrongly (a skill, an agent, a hook or a script).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a **security problem** (a hook or gate that can be bypassed),
        do not file it here: use [private vulnerability reporting](https://github.com/vkmtx/rumo-workflow/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: rumo version
      description: The `version` in `.claude-plugin/plugin.json`, or `claude plugin list`.
      placeholder: "0.12.4"
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version and OS
      placeholder: "claude --version, macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The command or prompt you ran, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Redact secrets, tokens, hostnames and personal paths first.
      render: shell
    validations:
      required: false
