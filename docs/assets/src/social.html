<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
:root{--w:1280px;--h:640px}
.wrap{position:absolute;inset:0;padding:64px 72px}
.brand{display:flex;align-items:center;gap:26px}
.brand svg{width:88px;height:88px}
.word{font-size:112px;font-weight:700;letter-spacing:-.045em;line-height:.8}
.tag{margin-top:28px;font-size:27px;line-height:1.3;font-weight:500;color:var(--ink-2);max-width:560px;letter-spacing:-.01em}
.tag b{color:var(--ink);font-weight:600}
.meta{position:absolute;left:72px;bottom:56px;display:flex;gap:10px}
.pill{font-family:'Geist Mono',monospace;font-size:15px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink-2)}
.pill i{font-style:normal;color:var(--accent)}
.route{position:absolute;right:8px;bottom:70px;width:740px;height:413px}
.route .lbl{font-family:'Geist Mono',monospace;font-size:19px;font-weight:500;fill:var(--ink)}
.route .sub{font-family:'Geist Mono',monospace;font-size:13.5px;fill:var(--muted)}
</style></head>
<body><div class="chart"></div><div class="vignette"></div>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="26" stroke="var(--ink)" stroke-width="3"/><path d="M32 6v6M58 32h-6M32 58v-6M6 32h6" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><path d="M47 17 35.5 35.5 28.5 28.5Z" fill="var(--accent)"/><path d="M17 47 28.5 28.5 35.5 35.5Z" fill="var(--ink)"/><circle cx="32" cy="32" r="2.6" fill="var(--paper)"/></svg>
    <div class="word">rumo</div>
  </div>
  <p class="tag"><b>From idea to merged PR.</b> An engineering workflow plugin for Claude Code.</p>
  <div class="meta"><span class="pill"><i>/</i>rumo</span><span class="pill">review gate</span><span class="pill">/learn</span><span class="pill">9 typed agents</span></div>
</div>
<svg class="route" viewBox="0 0 860 480" fill="none">
  <defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="var(--petrol)"/></marker></defs>
  <!-- /learn return leg -->
  <path d="M790 262 V 386 Q 790 404 772 404 H 128 Q 110 404 110 386 V 352" stroke="var(--petrol)" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" marker-end="url(#ah)"/>
  <rect x="368" y="390" width="144" height="28" rx="8" fill="var(--paper)"/>
  <text x="440" y="410" text-anchor="middle" class="lbl" style="fill:var(--petrol)">/learn</text>
  <text x="440" y="440" text-anchor="middle" class="sub">corrections → lessons → rules</text>
  <!-- plotted course: rhumb-line legs -->
  <path d="M110 330 L280 190 L450 282 L620 150 L790 250" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="sub" style="font-size:12px">
    <text x="172" y="248" transform="rotate(-40 172 248)">051°</text>
    <text x="352" y="226" transform="rotate(28 352 226)">118°</text>
    <text x="522" y="206" transform="rotate(-38 522 206)">052°</text>
    <text x="700" y="190" transform="rotate(30 700 190)">120°</text>
  </g>
  <!-- waypoints -->
  <circle cx="110" cy="330" r="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
  <text x="66" y="300" text-anchor="middle" class="lbl">align</text><text x="66" y="280" text-anchor="middle" class="sub">interview</text>
  <circle cx="280" cy="190" r="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
  <text x="280" y="150" text-anchor="middle" class="lbl">ticket</text><text x="280" y="130" text-anchor="middle" class="sub">GitHub issues</text>
  <circle cx="450" cy="282" r="12" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>
  <text x="450" y="328" text-anchor="middle" class="lbl">build</text><text x="450" y="348" text-anchor="middle" class="sub">planner → builders</text>
  <rect x="607" y="137" width="26" height="26" rx="7" fill="var(--petrol)"/>
  <text x="620" y="110" text-anchor="middle" class="lbl" style="fill:var(--petrol)">review</text><text x="620" y="90" text-anchor="middle" class="sub">tiered gate · stamp</text>
  <circle cx="790" cy="250" r="17" fill="var(--accent)"/><circle cx="790" cy="250" r="6" fill="var(--paper)"/>
  <text x="790" y="208" text-anchor="middle" class="lbl">merge</text><text x="790" y="188" text-anchor="middle" class="sub">PR · NEXT:</text>
</svg>
<script>if(location.search.includes('dark'))document.body.classList.add('dark')</script>
</body></html>
