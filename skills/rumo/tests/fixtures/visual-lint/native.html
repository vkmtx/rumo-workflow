<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<h1>Native controls</h1>
<style>input[type=time]{border:2px solid #06c;padding:10px}.f select:last-child{border:1px solid #06c;padding:10px;background:#fff}</style>
<select id="plain"><option>Plain</option></select>
<select id="bordered" style="border:1px solid #333;padding:8px 12px;background:#fff"><option>B</option></select>
<select id="base" style="appearance:base-select"><option>Base</option></select>
<select id="padonly" style="padding:10px"><option>P</option></select>
<input type="time" id="sheet">
<div class="f"><label>Pick</label><select id="lastchild"><option>L</option></select></div>
<select id="dis" disabled><option>D</option></select>
